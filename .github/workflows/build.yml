name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Before cleanup:"
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

          echo "After cleanup:"
          df -h /

      - name: Check Disk Space
        run: df -h
        
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y make patch curl git llvm lld build-essential \
            libncurses-dev libssl-dev bc flex bison rsync kmod cpio python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ccache
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

          git config --global user.name "runner"
          git config --global user.email "runner@kernel.local"
          git config --global color.ui false
          git config --global --add safe.directory '*'
          
      - name: Run Build Script
        run: |
          chmod +x kernel.sh
          sh kernel.sh

      - name: Prepare image.gz
        run: |
          mkdir -p dir_image_gz
          find . -type f \( -name "image.gz" -o -name "Image.gz" \) -exec cp {} dir_image_gz/ \;
      
      - name: Upload image.gz
        uses: actions/upload-artifact@v4
        with:
          name: image-gz
          path: dir_image_gz/

      - name: Prepare Image
        run: |
          mkdir -p dir_image
          find . -type f -name "Image" -exec cp {} dir_image/ \;
      
      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: dir_image/

      - name: Prepare Module.symvers
        run: |
          mkdir -p dir_symvers
          find . -type f -name "Module.symvers" -exec cp --parents {} dir_symvers/ \;
          ls -la dir_symvers/

      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: module-symvers
          path: dir_symvers/
