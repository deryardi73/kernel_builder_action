name: Build BORE Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        default: '6.12.96'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev flex bison \
            openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev \
            libiberty-dev autoconf bc rsync kmod cpio

      - name: Download kernel source
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          KMAJOR=$(echo $KVER | cut -d. -f1)
          wget https://cdn.kernel.org/pub/linux/kernel/v${KMAJOR}.x/linux-${KVER}.tar.xz
          tar xf linux-${KVER}.tar.xz
          mv linux-${KVER} linux-src

      - name: Fetch BORE patch
        run: |
          cd linux-src
          wget https://raw.githubusercontent.com/cachyos/kernel-patches/master/6.12/sched/0001-bore-cachy.patch
          sed -i 's/\r$//' 0001-bore-cachy.patch

      - name: Apply BORE patch
        run: |
          cd linux-src
          patch -p1 --dry-run < 0001-bore-cachy.patch
          patch -p1 < 0001-bore-cachy.patch

      - name: Configure kernel
        run: |
          cd linux-src
          make defconfig
          ./scripts/config --enable CONFIG_SCHED_BORE
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
          make olddefconfig

      - name: Build kernel deb packages
        run: |
          cd linux-src
          make -j$(nproc) bindeb-pkg LOCALVERSION=-bore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bore-kernel-debs
          path: |
            *.deb
          retention-days: 14
